<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔도천하 — 조선 군웅 전략</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efe6d2; --paper-2: #e6dbc2; --paper-3: #d8c9a6; --paper-hi: #f7f1e3;
    --ink: #1d1b18; --ink-2: #4a453d; --ink-3: #7a7266; --line: rgba(29, 27, 24, 0.18);
    --seal: #a8322a; --seal-2: #c4473b; --indigo: #2f4a5c; --gold: #a8842a; --good: #3f6b3a; --bad: #a8322a; --warn: #a8652a;
    --font-body: "Gowun Batang", "Batang", "AppleMyungjo", serif;
    --font-display: "Song Myung", "Gowun Batang", serif;
    --font-brush: "Nanum Brush Script", "Song Myung", cursive;
    --top-h: 56px; --panel-w: 390px; --radius: 6px;
    --shadow: 0 6px 24px rgba(40, 30, 10, 0.18), 0 1px 3px rgba(40, 30, 10, 0.12);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, select, input { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

  /* ── 위쪽 띠 ── */
  #top { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 10px; min-height: var(--top-h); background: linear-gradient(#f4ecda, #e9dec5); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 #fffaf0 inset; position: relative; z-index: 5; }
  .crest { width: 38px; height: 38px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: #fff; border-radius: 4px; transform: rotate(-3deg); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), 0 1px 2px rgba(0,0,0,0.25); }
  .fname { font-family: var(--font-display); font-size: 19px; line-height: 1.1; white-space: nowrap; }
  .fdate { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .res { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px 0; }
  .res::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 4px; background: var(--paper-hi); border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; font-size: 13px; }
  .chip .ic { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; font-family: var(--font-display); font-size: 13px; color: #fff; background: var(--ink-2); }
  .chip .d { font-size: 11px; color: var(--ink-3); }
  .chip .d.up { color: var(--good); } .chip .d.down { color: var(--bad); }
  .chip.click { cursor: pointer; } .chip.click:hover { border-color: var(--ink-3); }
  .nav { display: flex; gap: 4px; }
  .nbtn { border: 1px solid transparent; background: transparent; padding: 5px 9px; border-radius: 5px; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .nbtn:hover { background: rgba(0,0,0,0.05); border-color: var(--line); }
  .nbtn b { font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--ink-2); }
  .endturn { flex: none; background: var(--seal); color: #fff; border: none; border-radius: 6px; padding: 9px 16px; font-family: var(--font-display); font-size: 17px; letter-spacing: 0.05em; box-shadow: 0 2px 0 #7a221c, inset 0 1px 0 rgba(255,255,255,0.25); }
  .endturn:hover { background: var(--seal-2); }
  .endturn:active { transform: translateY(1px); box-shadow: 0 1px 0 #7a221c; }
  .endturn:disabled { opacity: 0.55; cursor: wait; }

  /* ── 본문 ── */
  #main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); min-height: 0; min-width: 0; }
  #mapwrap { position: relative; overflow: hidden; touch-action: none; background: #dfe3d6; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  .mapctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
  .mapctl button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper-hi); font-size: 18px; box-shadow: var(--shadow); }
  .legend { position: absolute; left: 10px; bottom: 10px; background: rgba(247, 241, 227, 0.92); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: min(420px, 70%); box-shadow: var(--shadow); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .maptip { position: absolute; pointer-events: none; background: rgba(29,27,24,0.88); color: #f7f1e3; padding: 5px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; transform: translate(12px, 12px); z-index: 3; }
  .modebar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--seal); color: #fff; padding: 6px 12px; border-radius: 999px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; font-size: 13px; z-index: 3; }
  .modebar button { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 999px; padding: 2px 10px; }

  /* ── 고을 판 ── */
  #panel { background: var(--paper); border-left: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; min-width: 0; overscroll-behavior: contain; display: flex; flex-direction: column; min-height: 0; }
  .ph { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); background: linear-gradient(var(--paper-hi), var(--paper)); position: sticky; top: 0; z-index: 2; }
  .ph h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ph h2 small { font-size: 15px; color: var(--ink-3); }
  .owner { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 1px 8px 1px 3px; border-radius: 999px; background: var(--paper-2); }
  .owner i { width: 16px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; font-style: normal; color: #fff; font-family: var(--font-display); font-size: 11px; }
  .rdesc { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 0; }
  .grip { display: none; }
  .pb { padding: 10px 14px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .pb > * { min-width: 0; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
  .stat { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 6px; font-size: 13px; }
  .stat .k { color: var(--ink-2); }
  .bar { height: 7px; background: var(--paper-3); border-radius: 4px; overflow: hidden; position: relative; }
  .bar > i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); border-radius: 4px; }
  .bar.cap > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.4; }
  .stat .v { font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .box { background: var(--paper-hi); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 10px; }
  .box h3 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 3px; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
  .tag.res { background: #f3ead2; }
  .tag.b { background: #e9efe2; } .tag.w { background: #f3e2d0; border-color: rgba(168,101,42,0.35); }
  .btn { border: 1px solid rgba(29,27,24,0.28); background: var(--paper-hi); padding: 6px 12px; border-radius: 5px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 5px; justify-content: center; }
  .btn:hover:not(:disabled) { background: #fff; border-color: var(--ink-2); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary { background: var(--ink); color: var(--paper-hi); border-color: var(--ink); }
  .btn.primary:hover:not(:disabled) { background: #33302b; }
  .btn.red { background: var(--seal); color: #fff; border-color: var(--seal); }
  .btn.red:hover:not(:disabled) { background: var(--seal-2); }
  .btn.small { padding: 3px 8px; font-size: 12.5px; }
  .btn.wide { width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { border: none; background: var(--paper-hi); padding: 4px 9px; font-size: 12.5px; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--ink); color: var(--paper-hi); }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
  .switch input { width: 16px; height: 16px; accent-color: var(--ink); }

  /* 장수 */
  .olist { display: flex; flex-direction: column; gap: 6px; }
  .ocard { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-hi); text-align: left; width: 100%; }
  .ocard:hover:not(.done) { border-color: var(--ink-2); background: #fff; }
  .ocard.done { opacity: 0.55; }
  .ocard img { width: 44px; height: 52px; border-radius: 4px; display: block; }
  .ocard .n { font-weight: 700; font-size: 14px; display: flex; gap: 5px; align-items: baseline; flex-wrap: wrap; }
  .ocard .n small { font-weight: 400; color: var(--ink-3); font-size: 11.5px; }
  .ocard .s { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .ocard .s b { font-weight: 700; color: var(--ink); }
  .ocard .st { font-size: 11px; text-align: right; color: var(--ink-3); white-space: nowrap; }
  .badge { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 3px; background: var(--ink-2); color: #fff; vertical-align: 1px; }
  .badge.r { background: var(--seal); } .badge.g { background: var(--good); } .badge.y { background: var(--gold); } .badge.m { background: #6b5a2e; }

  /* ── 대화 상자(모달) ── */
  .scrim { position: fixed; inset: 0; background: rgba(29, 24, 16, 0.42); z-index: 50; display: grid; place-items: center; padding: 12px; animation: fade 0.18s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .dlg { background: var(--paper); border-radius: 8px; box-shadow: 0 20px 60px rgba(20, 14, 4, 0.45); width: min(560px, 100%); max-height: min(92vh, 100%); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,0.4); animation: pop 0.2s ease-out; }
  @keyframes pop { from { transform: translateY(8px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .dlg.wide { width: min(980px, 100%); }
  .dlg.full { width: min(1200px, 100%); height: min(92vh, 100%); }
  .dh { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; background: linear-gradient(var(--paper-hi), var(--paper)); }
  .dh h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; flex: 1; }
  .dh .x { border: none; background: transparent; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--ink-2); }
  .db { padding: 14px 16px; overflow-y: auto; overscroll-behavior: contain; }
  .df { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: var(--paper-2); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; overflow-x: auto; }
  .tabs button { border: none; background: transparent; padding: 7px 12px; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; color: var(--ink-2); }
  .tabs button.on { border-bottom-color: var(--seal); color: var(--ink); font-weight: 700; }

  /* 명령 목록 */
  .acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .act { text-align: left; border: 1px solid var(--line); background: var(--paper-hi); border-radius: 6px; padding: 7px 9px; display: grid; gap: 1px; }
  .act:hover:not(:disabled) { border-color: var(--ink-2); background: #fff; }
  .act:disabled { opacity: 0.5; cursor: not-allowed; }
  .act .t { font-weight: 700; display: flex; gap: 5px; align-items: baseline; }
  .act .t small { font-family: var(--font-display); font-weight: 400; color: var(--ink-3); }
  .act .c { font-size: 11.5px; color: var(--ink-3); }
  .act .why { font-size: 11px; color: var(--bad); }
  .grp { font-size: 12px; color: var(--ink-3); margin: 8px 0 4px; letter-spacing: 0.1em; }

  /* 사건 */
  .evt { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: start; }
  .stamp { width: 92px; height: 92px; border: 3px solid var(--seal); color: var(--seal); border-radius: 6px; display: grid; place-items: center; font-family: var(--font-display); font-size: 52px; transform: rotate(-4deg); background: rgba(168, 50, 42, 0.05); box-shadow: inset 0 0 0 2px rgba(168,50,42,0.18); }
  .evt p { margin: 0 0 6px; font-size: 15.5px; line-height: 1.65; }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .choice { text-align: left; border: 1px solid rgba(29,27,24,0.28); background: var(--paper-hi); border-radius: 6px; padding: 9px 12px; display: grid; gap: 2px; }
  .choice:hover:not(:disabled) { border-color: var(--ink); background: #fff; }
  .choice:disabled { opacity: 0.45; cursor: not-allowed; }
  .choice b { font-size: 14.5px; }
  .choice span { font-size: 12px; color: var(--ink-3); }
  .result { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--seal); background: var(--paper-hi); font-size: 15px; }

  /* 표 */
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-weight: 700; color: var(--ink-2); padding: 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); cursor: pointer; white-space: nowrap; }
  table.t td { padding: 5px 6px; border-bottom: 1px solid rgba(29,27,24,0.08); vertical-align: middle; }
  table.t tr:hover td { background: rgba(255,255,255,0.5); }
  table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .hi { color: var(--good); font-weight: 700; } .lo { color: var(--bad); }

  /* 문물 나무 */
  .tree { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; min-width: 900px; }
  .era h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 20px; display: flex; gap: 6px; align-items: baseline; }
  .era h3 small { font-size: 12px; color: var(--ink-3); font-family: var(--font-body); }
  .tech { border: 1px solid var(--line); background: var(--paper-hi); border-radius: 6px; padding: 7px 9px; margin-bottom: 7px; text-align: left; width: 100%; display: grid; gap: 2px; position: relative; }
  .tech .nm { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
  .tech .nm small { font-family: var(--font-display); font-weight: 400; color: var(--ink-3); }
  .tech .ds { font-size: 11.5px; color: var(--ink-2); }
  .tech .rq { font-size: 11px; color: var(--ink-3); }
  .tech.done { background: #e4ebdc; border-color: rgba(63,107,58,0.4); }
  .tech.done .nm::after { content: '✓'; color: var(--good); }
  .tech.cur { border: 2px solid var(--seal); background: #fbefe6; }
  .tech.lock { opacity: 0.55; }
  .tech.av:hover { border-color: var(--ink); background: #fff; }
  .tech .pg { height: 5px; background: var(--paper-3); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .tech .pg i { display: block; height: 100%; background: var(--seal); }

  /* 정치 */
  .ig { display: grid; grid-template-columns: 80px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(29,27,24,0.07); }
  .ig .nm { font-weight: 700; }
  .ig .nm small { display: block; font-weight: 400; color: var(--ink-3); font-size: 11.5px; }
  .appr { position: relative; height: 12px; background: var(--paper-3); border-radius: 6px; }
  .appr::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); }
  .appr i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
  .law { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--paper-hi); margin-bottom: 8px; }
  .law h4 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 6px; align-items: baseline; }
  .law h4 small { font-family: var(--font-display); color: var(--ink-3); font-weight: 400; }
  .lopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .lopt { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; background: var(--paper); text-align: left; display: grid; gap: 2px; font-size: 12px; }
  .lopt b { font-size: 13px; }
  .lopt.on { border: 2px solid var(--ink); background: #fff; }
  .lopt:disabled { opacity: 0.5; cursor: not-allowed; }
  .lopt .igs { font-size: 11px; color: var(--ink-3); }

  /* 전투 */
  .battle { width: min(1100px, 100%); height: min(94vh, 100%); }
  .bf { display: grid; grid-template-columns: 1fr minmax(240px, 1.6fr) 1fr; gap: 10px; align-items: stretch; }
  .army { display: flex; flex-direction: column; gap: 6px; }
  .army .hd { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 18px; }
  .army .offs { display: flex; gap: 4px; flex-wrap: wrap; }
  .army .offs img { width: 46px; height: 54px; border-radius: 4px; border: 1px solid var(--line); }
  .army .offs .out { filter: grayscale(1); opacity: 0.4; }
  .gauge { display: grid; grid-template-columns: 34px 1fr 60px; gap: 6px; align-items: center; font-size: 12.5px; }
  .gauge .bar { height: 10px; }
  .gauge .v { text-align: right; font-variant-numeric: tabular-nums; }
  #bcanvas { width: 100%; height: 100%; min-height: 200px; display: block; border-radius: 6px; background: #e8dfc8; }
  .tacs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .tac { border: 1px solid rgba(29,27,24,0.3); background: var(--paper-hi); border-radius: 7px; padding: 8px 6px; display: grid; gap: 2px; justify-items: center; text-align: center; }
  .tac:hover:not(:disabled) { background: #fff; border-color: var(--ink); transform: translateY(-1px); }
  .tac:disabled { opacity: 0.4; cursor: not-allowed; }
  .tac .hz { font-family: var(--font-display); font-size: 24px; line-height: 1; color: var(--seal); }
  .tac .nm { font-weight: 700; font-size: 13px; }
  .tac .ds { font-size: 10.5px; color: var(--ink-3); line-height: 1.3; }
  .blog { font-size: 13px; max-height: 120px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 2px; }
  .blog div { padding: 2px 0; border-bottom: 1px dotted var(--line); }
  .blog .duel { color: var(--seal); font-weight: 700; }
  .bres { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(239, 230, 210, 0.86); z-index: 4; animation: fade 0.3s; }
  .bres .big { font-family: var(--font-brush); font-size: clamp(64px, 14vw, 140px); line-height: 1; }
  .bres .big.win { color: var(--seal); } .bres .big.lose { color: var(--ink-2); }

  /* 일기토 */
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
  .duel .f { display: grid; justify-items: center; gap: 6px; }
  .duel .f img { width: 120px; height: 142px; border-radius: 6px; border: 2px solid var(--ink-2); box-shadow: var(--shadow); }
  .duel .f.hit img { animation: shake 0.35s; }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px) rotate(-2deg); } 75% { transform: translateX(6px) rotate(2deg); } }
  .duel .vs { font-family: var(--font-brush); font-size: 54px; color: var(--seal); }
  .hp { width: 100%; height: 12px; background: var(--paper-3); border-radius: 6px; overflow: hidden; }
  .hp i { display: block; height: 100%; background: var(--seal); transition: width 0.4s; }
  .ki { width: 100%; height: 6px; background: var(--paper-3); border-radius: 3px; overflow: hidden; }
  .ki i { display: block; height: 100%; background: var(--gold); transition: width 0.4s; }
  .dacts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
  .bang { font-family: var(--font-brush); font-size: 46px; color: var(--seal); text-align: center; min-height: 54px; animation: pop 0.25s; }

  /* 알림 */
  #toasts { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 80; pointer-events: none; width: min(460px, 92vw); }
  .toast { background: rgba(29, 27, 24, 0.92); color: var(--paper-hi); padding: 9px 14px; border-radius: 6px; font-size: 14px; box-shadow: var(--shadow); animation: pop 0.2s; pointer-events: auto; }
  .toast.good { border-left: 4px solid #8fbf7a; } .toast.bad { border-left: 4px solid #e2735f; } .toast.info { border-left: 4px solid #d8c9a6; }
  .busy { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(29,24,16,0.25); }
  .busy .card { background: var(--paper); padding: 16px 22px; border-radius: 8px; box-shadow: var(--shadow); font-family: var(--font-display); font-size: 18px; display: flex; gap: 12px; align-items: center; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--paper-3); border-top-color: var(--seal); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 45; text-align: center; pointer-events: none; animation: bannerIn 2.2s ease-out forwards; }
  .banner .a { font-family: var(--font-brush); font-size: clamp(54px, 11vw, 110px); line-height: 1; color: var(--ink); text-shadow: 0 2px 0 var(--paper-hi), 0 0 24px var(--paper); }
  .banner .b { font-family: var(--font-display); font-size: 20px; color: var(--ink-2); text-shadow: 0 0 12px var(--paper); }
  @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -40%); } 15% { opacity: 1; transform: translate(-50%, -50%); } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* 타이틀 */
  #title { position: fixed; inset: 0; z-index: 90; background: var(--paper); overflow-y: auto; }
  #title canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .tw { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .tbox { display: grid; gap: 18px; justify-items: center; text-align: center; width: min(1000px, 100%); }
  .logo { font-family: var(--font-brush); font-size: clamp(84px, 19vw, 180px); line-height: 0.9; letter-spacing: 0.02em; color: var(--ink); text-shadow: 0 3px 0 rgba(255,255,255,0.6); }
  .logo-sub { font-family: var(--font-display); font-size: clamp(16px, 3.4vw, 24px); color: var(--ink-2); letter-spacing: 0.25em; }
  .tseal { width: 64px; height: 64px; border: 3px solid var(--seal); color: var(--seal); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; line-height: 1.05; border-radius: 4px; transform: rotate(-6deg); }
  .tmenu { display: grid; gap: 10px; width: min(300px, 90vw); }
  .tmenu .btn { padding: 12px; font-size: 17px; font-family: var(--font-display); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; width: 100%; text-align: left; }
  .card { background: rgba(247, 241, 227, 0.95); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; box-shadow: 0 2px 8px rgba(40,30,10,0.08); }
  .card:hover { border-color: var(--ink-2); transform: translateY(-2px); box-shadow: var(--shadow); }
  .card.on { border: 2px solid var(--seal); }
  .card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; display: flex; gap: 8px; align-items: center; }
  .card p { margin: 0; font-size: 13px; color: var(--ink-2); }
  .card .meta { font-size: 12px; color: var(--ink-3); }
  .fcard { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
  .fcard img { width: 64px; height: 76px; border-radius: 5px; }
  .stars { color: var(--seal); letter-spacing: 0.1em; }
  .help h3 { font-family: var(--font-display); font-weight: 400; font-size: 19px; margin: 14px 0 4px; }
  .help p, .help li { font-size: 14px; }
  .help ul { padding-left: 18px; margin: 4px 0; }
  .kbd { font-family: ui-monospace, monospace; font-size: 12px; background: var(--paper-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; }
  textarea.code { width: 100%; height: 140px; font-family: ui-monospace, monospace; font-size: 11px; background: var(--paper-hi); border: 1px solid var(--line); border-radius: 5px; padding: 6px; }
  input[type=range] { width: 100%; accent-color: var(--seal); }

  /* ── 좁은 화면 ── */
  @media (max-width: 860px) {
    :root { --top-h: 50px; }
    #top { flex-wrap: wrap; gap: 6px 8px; padding: 5px 8px; }
    .fname { font-size: 16px; }
    .crest { width: 32px; height: 32px; font-size: 18px; }
    .res { order: 3; flex-basis: 100%; }
    .nav { order: 4; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .endturn { margin-left: auto; padding: 7px 12px; font-size: 15px; }
    #main { grid-template-columns: minmax(0, 1fr); }
    .seg { flex-wrap: wrap; }
    #toasts { top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    #panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%; border-left: none; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; box-shadow: 0 -8px 30px rgba(40,30,10,0.2); z-index: 4; transition: transform 0.25s; }
    #panel.collapsed { transform: translateY(calc(100% - 92px)); }
    #panel.empty { display: none; }
    .grip { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--paper-3); margin: 0 auto 6px; }
    .ph { cursor: pointer; padding-top: 8px; }
    .ph h2 { font-size: 22px; }
    .legend { display: none; }
    .tacs { grid-template-columns: repeat(3, 1fr); }
    .bf { grid-template-columns: 1fr 1fr; }
    .bf .mid { grid-column: 1 / -1; order: 3; height: 160px; }
    .lopts { grid-template-columns: 1fr; }
    .evt { grid-template-columns: 1fr; }
    .stamp { width: 70px; height: 70px; font-size: 40px; }
    .duel .f img { width: 90px; height: 106px; }
    .dacts { grid-template-columns: repeat(3, 1fr); }
    .dlg.full, .battle { height: 100%; max-height: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
